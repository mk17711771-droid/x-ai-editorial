name: news-watch

# 速報の見張り。Cloudflare Workerが関連ニュース・HYPEの急変を見つけたときだけ起動される（GitHubの時間を節約）。
# 裏取りできた重要なニュースは速報として投稿し、LINEで知らせる。
on:
  repository_dispatch:
    types: [news_watch]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.BOT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch
        env:
          PYTHONPATH: src
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m aiedit.cli news-watch
          python -m aiedit.cli health || true
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: news watch $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
