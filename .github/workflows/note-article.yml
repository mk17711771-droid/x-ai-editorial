name: note-article

# noteの解説記事を作る（公開は手動）。水曜・土曜の朝7時台（日本時間）
on:
  # 主はCloudflare WorkerのCron Triggers（水・土の7:40）。GitHubの定時実行は予備
  repository_dispatch:
    types: [note_article]
  schedule:
    - cron: "9 0 * * 3,6"
  workflow_dispatch:
    inputs:
      theme:
        description: "テーマ（空欄なら曜日に合わせて自動）"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.BOT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Japanese font for charts
        run: sudo apt-get install -y -q fonts-noto-cjk >/dev/null || (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q fonts-noto-cjk >/dev/null)
      - name: Write article
        env:
          PYTHONPATH: src
          THEME: ${{ inputs.theme }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          if [ -n "$THEME" ]; then python -m aiedit.cli note-article --theme "$THEME"; else python -m aiedit.cli note-article; fi
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: note article $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
