name: deploy-worker

# worker/ を変更して main に保存すると、Cloudflare Worker（コード・Cron Triggers）へ自動で反映する。
# 管理者がCloudflareの画面で作業する必要はない。
# 必要なGitHub Secrets: CLOUDFLARE_API_TOKEN（「Workersを編集」の権限のAPIトークン）
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
        run: |
          set -o pipefail
          # 公式アカウントの見張り用に、X APIの読み取り専用トークン（アプリ認証）をWorkerに登録する
          bearer=$(curl -s -u "$X_API_KEY:$X_API_SECRET" -d grant_type=client_credentials https://api.x.com/oauth2/token | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -n "$bearer" ]; then
            echo "$bearer" | npx -y wrangler@4 secret put X_BEARER >/dev/null 2>&1 && echo "::notice::X_BEARER registered" || echo "::warning::X_BEARER の登録に失敗"
          else
            echo "::warning::X APIのアプリ認証トークンを取得できませんでした"
          fi
          if ! npx -y wrangler@4 deploy 2>&1 | tee deploy.log; then
            # 失敗の理由を注釈に出す（ログをダウンロードしなくても原因がわかるように）
            tail -n 25 deploy.log | sed 's/^/::error::/'
            exit 1
          fi
      - name: Check the deployed worker
        if: env.HAS_TOKEN == 'true'
        run: |
          sleep 10
          out=$(curl -s -w ' HTTP%{http_code}' https://x-ai-editorial-line.mk17711771.workers.dev/health)
          echo "::notice::worker health: $out"
          echo "$out" | grep -q '"ok":true' || { echo "::error::Workerの稼働確認に失敗: $out"; exit 1; }
          dbg=$(curl -s -m 60 https://x-ai-editorial-line.mk17711771.workers.dev/watch-debug)
          echo "::notice::watch debug: $dbg"
