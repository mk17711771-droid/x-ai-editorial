name: generate-drafts

# 投稿枠（日本時間）ごとに材料収集 → 編集 → 原稿作成 → LINEへ承認依頼
# cronはUTC。GitHubの定時実行は数分〜数十分遅れることがある
on:
  schedule:
    # 主はCloudflare WorkerのCron Triggers（毎日ランダムな時刻に repository_dispatch で起動）。
    # 以下はGitHubの定時実行による予備（遅れたり飛ばされたりする）。枠は1回しか生成しないので二重投稿にはならない
    - cron: "52 23 * * *"     # 08:52 JST（朝の枠の予備）
    - cron: "27 2 * * *"      # 11:27 JST
    - cron: "36 4 * * *"      # 13:36 JST
    - cron: "57 12 * * *"     # 21:57 JST
    - cron: "23 15 * * *"     # 00:23 JST
  # Cloudflare Worker の Cron Triggers から、毎日ランダムな投稿時刻に起動される（主）
  repository_dispatch:
    types: [generate]
  workflow_dispatch:
    inputs:
      slot:
        description: "枠ID（auto / 0730 / 1000 / 1215 / 2030 / 2030w / 2300）"
        default: "auto"
      force:
        description: "生成済みの枠でも再生成する"
        type: boolean
        default: false
      dry_run:
        description: "試し書き（投稿もLINE通知もしない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 初期設定が終わり、リポジトリ変数 BOT_ENABLED を true にするまでは動かない
    if: vars.BOT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # 順番待ちのあいだに他の実行がデータを更新しているため、起動時点ではなく最新のmainを使う
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Japanese font for charts
        # aptが固まることがあるので時間を区切る。失敗しても投稿は続ける（図だけ付かない）
        timeout-minutes: 4
        continue-on-error: true
        run: sudo apt-get install -y -q fonts-noto-cjk >/dev/null || (sudo apt-get update -q >/dev/null && sudo apt-get install -y -q fonts-noto-cjk >/dev/null)
      - name: Random delay
        # 毎日同じ時刻にならないよう、定時実行のときだけ0〜4分待つ
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        run: sleep $((RANDOM % 240))
      - name: Generate
        env:
          PYTHONPATH: src
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          X_PREMIUM: ${{ vars.X_PREMIUM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: python -m aiedit.cli generate --slot "${{ inputs.slot || 'auto' }}" ${{ inputs.force && '--force' || '' }}
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: generate $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
      - name: Notify failure
        if: failure()
        env:
          PYTHONPATH: src
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          python -m aiedit.cli notify --message "【異常】下書き生成が失敗しました。GitHub Actionsのログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
