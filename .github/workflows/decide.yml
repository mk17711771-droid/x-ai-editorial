name: decide-draft

# LINEの承認・却下ボタン → Cloudflare Worker → repository_dispatch で起動
on:
  repository_dispatch:
    types: [draft_decision, resume]

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 順番待ちのあいだに他の実行がデータを更新しているため、起動時点ではなく最新のmainを使う
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decide
        env:
          PYTHONPATH: src
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          X_PREMIUM: ${{ vars.X_PREMIUM }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
          DRAFT_ID: ${{ github.event.client_payload.id }}
          DRAFT_ACTION: ${{ github.event.client_payload.action }}
        run: |
          if [ "${{ github.event.action }}" = "resume" ]; then
            python -m aiedit.cli resume
          else
            python -m aiedit.cli decide --id "$DRAFT_ID" --action "$DRAFT_ACTION"
          fi
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: decide $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
