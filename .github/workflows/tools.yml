name: tools

# 手動で動かす補助ツール（ネットにつながるGitHub上で実行する）
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "実行するツール"
        type: choice
        options:
          - note-profile
          - note-audit
        default: note-profile

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          PYTHONPATH: src
          TOOL: ${{ inputs.tool }}
        run: python -m aiedit.cli "$TOOL"
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: tool $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          exit 1
