name: tools

# 手動で動かす補助ツール（ネットにつながるGitHub上で実行する）
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "実行するツール"
        type: choice
        options:
          - note-profile
          - note-audit
          - note-intro-draft
          - note-intro-publish
        default: note-profile

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser and Japanese font (note)
        if: startsWith(inputs.tool, 'note-intro')
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null
      - name: Run
        env:
          PYTHONPATH: src
          TOOL: ${{ inputs.tool }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          case "$TOOL" in
            note-intro-draft)   python -m aiedit.cli note-post --file content/note/intro.md ;;
            note-intro-publish) python -m aiedit.cli note-post --file content/note/intro.md --publish ;;
            *)                  python -m aiedit.cli "$TOOL" ;;
          esac
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: tool $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          exit 1
