name: tools

# 手動で動かす補助ツール（ネットにつながるGitHub上で実行する）
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "実行するツール"
        type: choice
        options:
          - note-profile
          - note-audit
          - sources
          - note-check
          - metrics-now
          - x-check
          - note-trends
          - delete-post
          - notify
        default: note-profile
      args_users:
        description: "x-check: 調べるアカウント（カンマ区切り）"
        default: ""
      args_query:
        description: "x-check: 検索語"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          PYTHONPATH: src
          TOOL: ${{ inputs.tool }}
          XC_USERS: ${{ inputs.args_users }}
          XC_QUERY: ${{ inputs.args_query }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          if [ "$TOOL" = "notify" ]; then
            # 点検から管理者へのLINE（管理者の操作が必要なときだけ）。args_users に本文
            python -m aiedit.cli notify --message "$XC_USERS"
          elif [ "$TOOL" = "delete-post" ]; then
            # 点検からの削除の予備の入口（11/10 decide-draft が「workflow file issue」で起動しなかった）。args_users に下書きIDを入れる
            python -m aiedit.cli decide --id "$XC_USERS" --action delete
          elif [ "$TOOL" = "x-check" ]; then
            python -m aiedit.cli x-check --users "$XC_USERS" --query "$XC_QUERY"
          elif [ "$TOOL" = "note-trends" ]; then
            python -c "from aiedit import sources; r = sources.note_trends(); print(len(r)); [print(x['likes'], x['title']) for x in sorted(r, key=lambda x: -(x['likes'] or 0))[:30]]"
          elif [ "$TOOL" = "sources" ]; then
            python -m aiedit.cli sources --daily --weekly
          else
            python -m aiedit.cli "$TOOL"
          fi
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: tool $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
