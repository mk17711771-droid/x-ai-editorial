name: research-and-learn

# 投稿していない時間のリサーチと学習
#   2時間ごと: 市場の定点観測 + 自分の投稿の反応（24時間後・7日後）とフォロワー数の計測
#   毎朝5:23（日本時間）: 成果を分析して運用ノートを更新（日曜は週間レポートをLINEに送る）
on:
  schedule:
    - cron: "37 */2 * * *"
    - cron: "23 20 * * *"
  workflow_dispatch:
    inputs:
      learn:
        description: "学習（運用ノートの更新）も実行する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.BOT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research
        env:
          PYTHONPATH: src
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ADMIN_USER_ID: ${{ secrets.LINE_ADMIN_USER_ID }}
        run: |
          python -m aiedit.cli research
          if [ "${{ github.event.schedule }}" = "23 20 * * *" ] || [ "${{ inputs.learn }}" = "true" ]; then
            python -m aiedit.cli learn
          fi
      - name: Save data
        if: always()
        run: |
          git config user.name "ai-editorial-bot"
          git config user.email "ai-editorial-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: research $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          exit 1
