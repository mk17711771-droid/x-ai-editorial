# X AI編集部 設定ファイル
# 時刻はすべて日本時間（JST）

account:
  handle: satoshikun_666
  # X Premium加入時は true（長文の考察投稿が有効になる）
  premium: true

# 運用モード
#   approval: LINEで承認したものだけ投稿（初期2週間はこちら）
#   auto:     採点80点以上かつ全チェック通過で自動投稿
# GitHubのリポジトリ変数 APPROVAL_MODE で上書き可能
mode: approval

# 投稿枠（ちょうどの時刻だと機械的に見えるので半端な時刻にしている。
#   実際の投稿はGitHubの起動遅れと数分のランダムな待ちで、毎日さらに前後する）
#   kind: stock = 米国株 / hl = Hyperliquid
#   days: weekday = 平日のみ / weekend = 土日のみ / all = 毎日
#   format: long = 長文の考察投稿（X Premiumのみ。指定なしは短文）
slots:
  - { id: "0730", time: "07:42", kind: stock, days: weekday, format: long, theme: "朝の考察（長文）: 前夜の米国株でいちばんの“違和感”（決算での急落・急騰、明暗の分かれた銘柄）を主役に、HIP-3株式先物の建玉・資金調達率の歪みで読み解く。1行目は銘柄名と値動きの問い" }
  - { id: "1000", time: "10:17", kind: hl,    days: weekday, theme: "Hyperliquidの24時間の異変（建玉・資金調達率・急変動）" }
  - { id: "1000w", time: "10:17", kind: hl,   days: weekend, format: long, weekly: true, theme: "今週の振り返り（長文）: 1週間でいちばんの“違和感”（大きく上げた・下げた銘柄、明暗）を「なぜ〜？」の問いで主役にし、HIP-3株式先物と米国株の数字で読み解く" }
  - { id: "1215", time: "12:26", kind: stock, days: weekday, theme: "市場の異変の解説" }
  - { id: "2030", time: "20:47", kind: stock, days: weekday, format: long, theme: "考察（長文）: 米国株・半導体とHIP-3株式先物から見える資金の流れと、今夜〜翌日の注目点" }
  - { id: "2030w", time: "20:47", kind: hl,   days: weekend, format: long, theme: "週末考察（長文）: Hyperliquidの資金の流れと、来週見るべきポイント" }
  # 11/7〜 週末も1日5投稿（週末は2枠＋noteだけで、1日5〜6投稿の方針と数字の両方で不足していた）。米国市場が閉まっている間もHIP-3の株式先物は動く＝週末だけの“歪み”
  - { id: "0730w", time: "07:42", kind: hl,   days: weekend, theme: "週末の朝: 米国市場が閉まっている間に動いたHIP-3株式先物・HYPE・BTCの数字1つ（大きな名前＋極端な数字を1行目で言い切る）" }
  - { id: "1215w", time: "12:26", kind: hl,   days: weekend, theme: "週末の昼: Hyperliquidの24時間の異変（建玉・資金調達率・急変動）。大きな名前の銘柄を優先" }
  - { id: "2300w", time: "23:13", kind: hl,   days: weekend, theme: "週末の夜: 週明けの米国市場の前に、HIP-3株式先物が示している方向（金曜終値との差・資金調達率の偏り）" }
  - { id: "news", time: "00:00", kind: hl,    days: manual,  theme: "速報（確認済みのニュース）と、Hyperliquidの実データで見る市場の反応" }
  - { id: "newslong", time: "00:00", kind: hl, days: manual, format: long, theme: "話題のニュースの解説（長文）: 初めての人にもわかるように、何が起きたか・何が変わるか・実データで見る市場の反応・次に見るところ" }
  - { id: "2300", time: "23:13", kind: hl,    days: weekday, theme: "米国市場オープン前後のHyperliquid（株式先物・暗号資産）" }

# GitHub Actionsの定時実行は遅延することがあるため、枠の時刻から何分後まで生成を許可するか
slot_grace_minutes: 120
# 投稿時刻は毎日ランダムにずらす（Cloudflare Workerが枠の時刻の約25分前〜25分後のどこかで起動する）。
# そのため枠の時刻より前の起動も、この分数までは受け付ける
slot_early_minutes: 25

# 編集長AIの採点基準
scoring:
  auto_post_min: 80     # これ以上: 自動投稿候補
  revise_min: 65        # 65〜79: 再編集（MVPでは不採用扱い）

# 安全装置
limits:
  max_posts_per_day: 8
  max_candidates_per_slot: 3   # LINEに送る候補数
  draft_expiry_hours: 3        # これを過ぎた下書きは承認しても投稿しない
  similarity_threshold: 0.45   # 過去投稿との類似度がこれ以上なら不採用
  same_topic_cooldown_hours: 24
  same_symbol_cooldown_hours: 30
  topic_cooldown_overrides:        # 定番企画は間隔を空ける（時間）
    "traders:funnel": 168   # 同じ銘柄を主役（キャッシュタグ）にした投稿を続けない
    ":week_change": 120     # 1週間の振り返りは週1回（11/22 土日続けてほぼ同じ長文が出た）
  # 投稿直前の再確認で、騰落率がこれ以上変わっていたら投稿を中止（ポイント）
  recheck_change_pct_tolerance: 1.5

# 米国株の監視銘柄（Finnhub無料プランで取得）
stocks:
  watchlist:
    - SPY
    - QQQ
    - SOXX
    - NVDA
    - AMD
    - AVGO
    - TSM
    - ASML
    - MU
    - ARM
    - INTC
    - SMCI
    - MSFT
    - GOOGL
    - META
    - AMZN
    - AAPL
    - TSLA
    - PLTR
    - COIN
    - HOOD
  big_move_pct: 3.0       # これ以上の騰落率を「異変」として扱う
  earnings_lookahead_days: 7
  news_max: 15

# Hyperliquid
hyperliquid:
  min_day_volume_usd: 5000000   # これ未満の銘柄は扱わない（小型銘柄の誤情報・相場操縦リスク回避）
  top_n: 5
  big_move_pct: 8.0
  funding_extreme_annual_pct: 50.0
  include_hip3: true             # HIP-3（株式先物など）の市場も対象にする

# LINEのボタンとnote記事のコピー用ページを受け持つCloudflare Worker
worker_url: https://x-ai-editorial-line.mk17711771.workers.dev

images:
  # 実データから作ったチャート画像を投稿に付ける
  enabled: true

llm:
  # Google AI Studio で利用可能なモデル名。GitHubのリポジトリ変数 GEMINI_MODEL で上書き可能
  model: gemini-flash-latest
  # 混雑時に順に切り替える予備モデル
  # 存在しないモデル名は自動で飛ばす
  fallback_models:
    - gemini-flash-lite-latest
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
    # 11/23〜25 深夜（日本時間23時台）に2つのモデルが同時に混雑（503/429）して3晩続けて枠を落とした。予備を増やす（無料枠・存在しなければ自動で飛ばす）
    - gemini-2.0-flash
    - gemini-2.0-flash-lite
    - gemini-pro-latest
    - gemini-2.0-flash
    - gemini-3-flash
    - gemini-2.5-flash
    # 11/26 深夜に flash=429・lite=503・pro=429 で4晩目の枠落ち。Gemma は別の無料枠（1日の回数が多い）なので最後の予備にする
    - gemma-3-27b-it
  temperature: 0.7

note:
  promo_link: false   # 11/15〜試み: Xの紹介投稿に外部リンクを入れず、プロフィールのnoteへ誘導（リンク付きは15〜23表示どまり）
  urlname: charisma_hl
  # これ以降に公開された記事を確認する（それより前の記事は対象外）
  check_since: "2026-10-27T00:00:00+09:00"

# 投稿していない時間の外部リサーチ（流れ・型の参考。投稿の数字には使わない）
research:
  news_queries:                  # Google ニュース（無料・毎日）
    - Hyperliquid
    - 仮想通貨 デリバティブ
    - 米国株 半導体
    - エヌビディア 決算
    - FOMC 米国株
    - Hyperliquid whale
    - trade.xyz Hyperliquid
    - ICE Hyperliquid
    - HIP-3 perps
    - semiconductor stocks
  # noteの検索APIはプログラムからのアクセスを拒否（403）しているため使わない。
  # noteの反応は自分の記事のスキ数（note-check が毎日記録）で測る。
  note_queries:                  # noteの人気記事（ハッシュタグ名としても使う。無料）
    - 米国株
    - 仮想通貨
    - 暗号資産
    - 半導体
    - Hyperliquid
  x:                             # Xの同ジャンルの伸びた投稿（有料: 1件約0.75円。毎日1つずつ順番に検索）
    enabled: true                # 同ジャンルの伸びた投稿の分析に必要（止めると分析の材料がなくなる）。費用を抑えて毎日1テーマ×10件（約7.5円/日）
    monthly_read_limit: 250      # 月の上限（約190円）。11/19 管理者の指示「費用はできるだけゼロに」: 検索は2日に1回、参考アカウントは1日最大5件
    per_query: 10                 # X APIの最低件数は10
    rotate: true
    every_n_days: 2               # 検索は2日に1回（費用を半分に）
    reference_max_per_day: 5
    queries:
      - "(Hyperliquid OR ハイパーリキッド OR HIP-3) lang:ja -is:retweet -is:reply"
      - "(米国株 OR 半導体株) (資金 OR 建玉 OR 決算) lang:ja -is:retweet -is:reply has:media"
      - "(Hyperliquid OR HYPE) (whale OR funding OR \"open interest\") lang:en -is:retweet -is:reply has:media"
      # 11/19 参考アカウント（@yozawape）に似た投稿（国内の暗号資産の規制・取引所のニュース＋自分の見立て）を探す
      - "(暗号資産 OR 仮想通貨) (規制 OR 金融庁 OR 規約 OR 取引所) lang:ja -is:retweet -is:reply"
    accounts: []                 # 参考にしたいアカウント（例: satoshikun_666 は自分なので入れない）
    reference_accounts:          # 管理者が「良い投稿で勉強になる」と選んだアカウント（11/19）。24〜48時間前の投稿を毎日1回読み、伸びた型だけを参考にする
      - yozawape

# 速報の見張り（Hyperliquid・trade[XYZ]・HIP-3・株式Perpを扱うサービス）
news_watch:
  min_importance: 4              # 1〜5。4以上を速報として扱う
  max_posts_per_day: 5            # 熱い話題の速報・続報（通常の投稿とは別枠）
  official_accounts: []          # 公式アカウントは Cloudflare Worker が10分おきに確認する（直近11分の投稿だけ読むので、新しい投稿がなければ無料）
  official_monthly_read_limit: 150               # 約110円（費用を抑える）
  verify_queries:                # 裏取り用（直近24時間の報道を集める）
    - Hyperliquid
    - trade.xyz
    - stock perpetuals
    - 株式 無期限先物
    - Binance hack withdrawals
    - 取引所 ハッキング 出金停止
    - crypto hack exploit
    - 暗号資産 急落 理由

# 返信の候補（停止中: 費用に対して候補の質が低く、コピペの手間もかかるため管理者の判断で中止 10/30）
reply_ideas:
  queries:                       # 毎日の検索（1件約0.75円。1日20件まで ≒ 月約450円）
    - "(Hyperliquid OR ハイパーリキッド OR HYPE OR 株式パーペチュアル OR trade.xyz) lang:ja -is:retweet -is:reply"
    - "(米国株 OR 半導体 OR エヌビディア OR NVDA OR 決算) lang:ja -is:retweet -is:reply has:media"
  per_query: 10
  min_followers: 2000            # 自分より大きく、届けたい読者がいるアカウント
  max_followers: 500000
  max_age_hours: 12              # 新しい投稿ほど返信が読まれる
  max_ideas: 8

# 期間限定の話題（管理者の指示 11/19: 米中ロ首脳会談がAI・株・暗号資産に与えうる影響を、今日から明日の投稿に盛り込む）
focus:
  until: "2026-11-20T23:59:00+09:00"
  note: |
    11/19（木）に深圳のAPECに合わせて、米中ロの首脳（トランプ大統領・習近平国家主席・プーチン大統領）が初めて3者で会談する予定（材料の category: breaking_news・status: context）。
    今日と明日は、各枠のうち1日2件まで、この会談を「市場がどう受け止めているか」の切り口に使ってよい（夜の長文・昼の短文を優先）。
    書き方:
    - 会談の事実は材料の headline・what だけを使う。結果・合意の有無・発言は材料にない限り書かない（「結果はまだ見えない」「会談をはさんで」と書く）。
    - 影響は「注目点」として書く: AI・半導体（米中の輸出規制・NVDAなど）、株価指数（S&P500・ナスダック100）、暗号資産（BTC・HYPE）。必ず材料の数字（HIP-3の指数先物・半導体の先物の価格・資金調達率・建玉、BTC・HYPEの値動き）と結びつける。
    - 「上がる・下がる」の予想や売買を勧める表現は書かない。政治の評価（良い・悪い）もしない。
    - 主役はこれまでどおり top_names（SOXL・QQQ・ナスダック100・S&P500）を優先。
