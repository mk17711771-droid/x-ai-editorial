name = "x-ai-editorial-line"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 投稿枠の時刻（UTC）。07:42 / 10:17 / 12:26 / 20:47 / 23:13（日本時間）
[triggers]
crons = ["42 22 * * *", "17 1 * * *", "26 3 * * *", "47 11 * * *", "13 14 * * *"]

[vars]
GITHUB_REPO = "mk17711771-droid/x-ai-editorial"

# 以下は `npx wrangler secret put <名前>` で設定する（ここには書かない）
# LINE_CHANNEL_SECRET
# LINE_CHANNEL_ACCESS_TOKEN
# LINE_ADMIN_USER_ID
# GITHUB_TOKEN
